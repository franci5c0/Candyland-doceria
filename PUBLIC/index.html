<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CandyLand</title>
    <link rel="stylesheet" href="../css/padrao.css" />
    <link rel="stylesheet" href="../css/index.css" />
  </head>
  <body>
    <header class="topo">
      <img src="../images/Logo.png" alt="CandyLand" class="logo" />
        <h1 class="main-tittle">Bem-vindo(a) a CandyLand!</h1>
        <h2 class="second-tittle">
          Acesse nossos cardápios para fazer seu pedido.
        </h2>
    </header>

    <!----------------------------------------------->

    <hr class="line" />

    <section class="sessao">
      <article class="artigo">
      <a class="menu-link" href="Cupcakes.html">
         <img src="../images/cupcakes.png" alt="Cupcakes" class="img-index" />
       </a>
      <!--  -->
      <a href="../public/Puddings.html" class="menu-link"><img src="../images/pudim.jfif" alt="Pudins"
          class="img-index" /></a>
      <!--  -->
      <a href="../public/Cakes.html" class="menu-link"><img src="../images/cakes.jfif" alt="Bolos" class="img-index" /></a>
      </article>

      <article class="artigo">
        <img
          src="../images/cheesecakes.jfif"
          alt="Cheesecakes"
          class="img-index"
        />
        <img src="../images/Icecream.png" alt="Sorvetes" class="img-index" />
        <img src="../images/Donuts.png" alt="Donuts" class="img-index" />
      </article>

      <article class="artigo">
        <img src="../images/Quindins.png" alt="Quindins" class="img-index" />
        <img src="../images/Mousses.png" alt="Mousses" class="img-index" />
        <img src="../images/Brownies.png" alt="Brownies" class="img-index" />
      </article>
    </section>

    <!----------------------------------------------->

    <hr class="line" />

    <footer class="rodape">
      <div class="media">
        <h2 class="media-tittle">midias sociais:</h2>
        <img src="../images/face-logo.png" alt="Facebook" class="img-footer" />
        <img
          src="../images/instagram-logo.png"
          alt="Instagram"
          class="img-footer"
        />
      </div>
       <article class="about">
        <img src="../images/about.png" alt="Sobre nós" class="about-img">
      </article> 
      <div class="payment">
        <div class="div-card">
          <img
            src="../images/Credit.png"
            alt="Cartão de crédito"
            class="payment-img"
          />
          <img src="../images/pix.png" alt="Pix" class="payment-img" />
          <h3 class="payment-tittle">Formas de pagamento</h3>
        </div>
      </div>
    </footer>
  </body>
</html>
