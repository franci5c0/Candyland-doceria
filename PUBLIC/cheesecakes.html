<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheesecakes</title>
    <link rel="stylesheet" href="../css/padrao.css"/>
    <link rel="stylesheet" href="../css/menu.css"/>
    <link rel="icon" href="../images/default-images/logo.ico" type="image/x-icon"/>
</head>
<body>
    <header class="topo">
        <img src="../images/default-images/logo.png" alt="CandyLand" class="logo" />
        </header>

        <!----------------------------------------------->


        <hr class="line"/>

        <!-- INÍCIO DO ARTIGO -->
         <article class="menu-article">
            <div class="div-menu">
                <img src="../images/cheesecakes/chocolate.jpg" alt="Chocolate" class="img-menu">
                <p class="name-menu">Chocolate</p>
                <span class="price">R$ 12,00</span>
                
                <div class="quantity-counter">
                    <label for="qtd-chocolate" class="quantity-label">Qtd:</label>
                    <input type="number" id="qtd-chocolate" name="qtd-chocolate" min="0" value="0" class="quantity-input">
            </div>
         </article>

</body>
</html>
